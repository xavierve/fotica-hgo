baseURL = 'https://opticasfausto.com/'
locale = 'es-ES'
defaultContentLanguage = 'es'
title = 'Ópticas Fausto · Centro Óptico y Auditivo en Torre del Mar'
theme = 'f1-theme'
enableRobotsTXT = true
# Sin feeds RSS (no hay blog) ni taxonomías.
disableKinds = ['rss', 'taxonomy', 'term']

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
    [markup.goldmark.parser.attribute]
      title = true
      block = true

[params]
  siteName = 'Ópticas Fausto'
  defaultOgImage = '/images/og/0-inicio.jpg'

  # Politica del hero de ESTE sitio (el tema, sin esto, usa overlay en todos
  # los anchos). Publico 45-75+: foto arriba y texto debajo por defecto, y
  # nunca texto sobre foto en movil. Una pagina puede pedir hero.layout:
  # overlay o split como excepcion. Ver FRONTMATTER.md, "Hero: layouts".
  [params.hero]
    layout = 'stacked'
    mobileOverlay = false

# public/contacto/config.php lo genera el shortcode contact-form (ver el shortcode);
# .php necesita su tipo de medio para que Hugo lo publique.
[mediaTypes]
  [mediaTypes.'application/x-httpd-php']
    suffixes = ['php']
