{{ $schema := .Params.schema }}
{{ if or .IsHome $schema }}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "{{ or $schema.type (cond .IsHome "LocalBusiness" "WebPage") }}",
  "name": {{ or .Params.title .Title site.Title | jsonify }},
  "description": {{ or .Params.description .Params.seo.description site.Data.site.business.description | jsonify }},
  "url": {{ .Permalink | jsonify }}{{ with site.Data.site.business.phone }},
  "telephone": {{ . | jsonify }}{{ end }}{{ with site.Data.site.business.email }},
  "email": {{ . | jsonify }}{{ end }}
}
</script>
{{ end }}
{{ if .Params.faq }}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "FAQPage",
  "mainEntity": [
    {{ range $i, $item := .Params.faq }}{{ if $i }},{{ end }}
    {
      "@type": "Question",
      "name": {{ $item.question | jsonify }},
      "acceptedAnswer": {"@type": "Answer", "text": {{ $item.answer | plainify | jsonify }}}
    }
    {{ end }}
  ]
}
</script>
{{ end }}
