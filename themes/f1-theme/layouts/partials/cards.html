<section class="section cards-section">
  <div class="container">
    {{ with .title }}<h2>{{ . }}</h2>{{ end }}
    {{ with .subtitle }}<p class="section-subtitle">{{ . }}</p>{{ end }}
    <div class="cards-grid">
      {{ range .cards }}
      <article class="card">
        {{ with .image }}<img src="{{ . }}" alt="{{ .imageAlt }}">{{ end }}
        <div class="card-body">
          {{ with .title }}<h3>{{ . }}</h3>{{ end }}
          {{ with .description }}<p>{{ . }}</p>{{ end }}
          {{ with .link }}<a class="card-link" href="{{ . }}">{{ $.linkText | default "Ver más" }}</a>{{ end }}
        </div>
      </article>
      {{ end }}
    </div>
  </div>
</section>
