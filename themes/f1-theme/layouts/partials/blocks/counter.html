{{ with .items }}
{{ $extra := slice }}
{{ if $.animated }}{{ $extra = $extra | append "is-animated" }}{{ end }}
<section class="{{ partial "block-classes.html" (dict "name" "counter" "context" $ "extra" $extra) }}"{{ with $.imageBackground }} style="--section-bg: url('{{ . }}');"{{ end }}>
  <div class="container">
    <div class="counter-grid">
      {{ range . }}
      <div class="counter-item">
        <strong>{{ .number }}</strong>
        <span>{{ .label }}</span>
      </div>
      {{ end }}
    </div>
    {{ with $.text }}<p class="section-note">{{ . }}</p>{{ end }}
  </div>
</section>
{{ end }}
