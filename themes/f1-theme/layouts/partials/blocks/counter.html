{{ with .items }}
<section class="section counter"{{ with $.imageBackground }} style="--section-bg: url('{{ . }}');"{{ end }}>
  <div class="container">
    <div class="counter-grid">
      {{ range . }}
      <div class="counter-item">
        <strong>{{ .number }}</strong>
        <span>{{ .label }}</span>
      </div>
      {{ end }}
    </div>
    {{ with $.text }}<p class="section-note">{{ . }}</p>{{ end }}
  </div>
</section>
{{ end }}
