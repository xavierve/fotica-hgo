<section class="{{ partial "block-classes.html" (dict "name" "timeline" "context" .) }}">
  <div class="container">
    {{ partial "block-heading.html" (dict "eyebrow" .eyebrow "title" .title "subtitle" .subtitle) }}
    <ol class="timeline-list">
      {{ range .items }}<li><strong>{{ .number }}</strong><h3>{{ .event_title }}</h3><p>{{ .event_text }}</p></li>{{ end }}
    </ol>
  </div>
</section>
