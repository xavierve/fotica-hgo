{{ $tone := .tone | default "neutral" }}
<section class="{{ partial "block-classes.html" (dict "name" "cta-banner" "context" . "extra" (slice (printf "cta-tone-%s" $tone))) }}"{{ with .imageBackground }} style="--section-bg: url('{{ . }}');"{{ end }}>
  <div class="container cta-banner-inner">
    {{ with .title }}<h2>{{ . }}</h2>{{ end }}
    {{ with .subtitle }}<p>{{ . }}</p>{{ end }}
    {{ if or .button1 .button2 }}
    <div class="cta-row">
      {{ with .button1 }}<a class="btn" href="{{ .url | safeURL }}">{{ .text }}</a>{{ end }}
      {{ with .button2 }}<a class="btn btn-outline" href="{{ .url | safeURL }}">{{ .text }}</a>{{ end }}
    </div>
    {{ end }}
  </div>
</section>
