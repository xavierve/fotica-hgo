{{ with .items }}
<section class="{{ partial "block-classes.html" (dict "name" "trustbar" "context" $) }}" aria-label="Datos de confianza">
  <div class="container trustbar-inner">
    {{ range . }}
    <span>
      {{ with .icon }}<span aria-hidden="true">{{ . }}</span>{{ end }}
      {{ .text }}
    </span>
    {{ end }}
  </div>
</section>
{{ end }}
