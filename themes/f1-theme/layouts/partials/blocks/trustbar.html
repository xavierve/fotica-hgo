{{ with .items }}
<section class="{{ partial "block-classes.html" (dict "name" "trustbar" "context" $) }}" aria-label="{{ i18n "trustbarLabel" }}">
  <div class="container">
    {{ with $.title }}<h2>{{ . }}</h2>{{ end }}
    <div class="trustbar-inner">
    {{ range . }}
    <span>
      {{ with .icon }}{{ with partial "icons.html" . }}<span class="trustbar-icon" aria-hidden="true">{{ . }}</span>{{ end }}{{ end }}
      {{ .text }}
    </span>
    {{ end }}
    </div>
  </div>
</section>
{{ end }}
