<section class="{{ partial "block-classes.html" (dict "name" "team" "context" .) }}">
  <div class="container">
    {{ with .title }}<h2>{{ . }}</h2>{{ end }}
    {{ with .subtitle }}<p class="section-subtitle">{{ . }}</p>{{ end }}
    <div class="cards-grid">
      {{ range .items }}<article class="team-card">{{ partial "responsive-img.html" (dict "src" .image "alt" .imageAlt "sizes" "(min-width:1100px) 33vw, (min-width:600px) 50vw, 100vw") }}<h3>{{ .name }}</h3><p>{{ .role }}</p></article>{{ end }}
    </div>
  </div>
</section>
