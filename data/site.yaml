# data/site.yaml — Ópticas Fausto
# v04 — Horarios validados por cliente. Fuente única: contact.hours (footer/contacto)
#        y location.hoursSpec (schema.org). Cambiar aquí → se actualiza en todo el sitio.
# NOTA: actualizar también los dos Google Business Profiles cuando cambie el horario.

brand:
  name: "Ópticas Fausto"
  logo: "/images/logo-fausto.svg"
  logoAlt: "Ópticas Fausto — Centro Óptico y Auditivo en Torre del Mar"
  logoInline: "images/logo-fausto-animado.svg"
  themeColor: "#08783e"   # <meta name="theme-color">; mantener igual que --bg-color3

footer:
  brand:
    logo: "/images/logo-fausto-animado-claro.svg"
    logoAlt: "Ópticas Fausto — Centro Óptico y Auditivo en Torre del Mar"
  title: "Ópticas Fausto"
  description: "Desde 1982, cuidando bien de la vista y del oído."

business:
  locationType: "Optician"
  foundingDate: "1982"
  addressLocality: "Torre del Mar"
  postalCode: "29740"
  addressRegion: "Málaga"
  addressCountry: "ES"
  areaServed: "Torre del Mar, Vélez-Málaga, Málaga"
  offerCatalogs:
    - { name: "Visión", url: "/vision/" }
    - { name: "Audición", url: "/audicion/" }

# ─── CONTACTO ────────────────────────────────────────────────────────────────
# CANALES. Cambiar un número aquí → cambia en todo el sitio. Ningún .md lleva un
# número escrito a mano: botones con url: phone y textos con {phone}.
#   phone     LLAMADAS: cabecera, barra fija, botones Llamar, {phone}. Hoy, el
#             fijo de Andalucía. Los fijos NO tienen WhatsApp.
#   whatsapp  el móvil, único número con WhatsApp: botones WhatsApp, icono del
#             footer, {whatsapp}.
# Canal nuevo (p. ej. un teléfono propio de audición): una clave que empiece por
# phone o whatsapp + su Label, y ya se puede usar (url: phoneAudicion, {phoneAudicion}):
#   phoneAudicion: "+34…"
#   phoneAudicionLabel: "…"
contact:
  phone: "+34952540964"
  phoneLabel: "952 54 09 64"
  whatsapp: "+34717770090"
  whatsappLabel: "717 77 00 90"
  # Direccion de contacto CODIFICADA: base64 de la cadena invertida. Este repo es
  # publico, y una direccion en claro aqui se recolecta igual que en una pagina.
  # La decodifica partials/email-addr.html; para pintarla se usa email-link.html.
  # Para cambiarla:
  #   python -c "import base64;print(base64.b64encode('LA@DIRECCION.COM'[::-1].encode()).decode())"
  emailEnc: "bW9jLm90c3VhZnNhY2l0cG9Ab3RjYXRub2M="
  # Destino del icono Ubicacion de la barra fija movil: id de una entrada de
  # locations[] (usa su mapUrl; no repetir la URL aqui). Sin locationId el tema
  # cae a contact.locationUrl y, si tampoco existe, a /contacto/.
  locationId: "andalucia"

  # Formulario de contacto (/contacto/). Hugo genera public/contacto/config.php a
  # partir de esto; static/contacto/enviar.php lo lee. El destinatario es el buzon
  # de contact.email salvo que se ponga "to" aqui.
  #   from: direccion del PROPIO dominio del sitio (baseURL). Si no lo esta, el build
  #         falla: un From de otro dominio rompe la alineacion SPF/DKIM. NUNCA es la
  #         direccion del visitante (esa va en Reply-To). Conviene que exista como
  #         buzon, para recibir los rebotes.
  form:
    # Buzon EXCLUSIVO del formulario y cuenta SMTP autenticada: el From tiene que coincidir
    # con la cuenta con la que enviar.php se identifica. Su contrasena NO esta en el repo: va en
    # smtp.php, fuera de public_html (CLAUDE.md, tarea 5). Tiene reenvio a web@ para los rebotes.
    from: "formulario@opticasfausto.com"
    fromName: "Ópticas Fausto (web)"
    # Enlaces (http://, https://, www., [url], <a) admitidos en nombre y mensaje. 0 = ninguno;
    # -1 = sin limite. Lo aplican el servidor y el navegador. Con enlaces de mas, error VISIBLE
    # que pide quitarlos: un cliente real que pego uno puede corregirlo; un exito falso perderia
    # su mensaje. Los correos (pepe@gmail.com) no cuentan como enlace.
    maxLinks: 0
    # to: "contacto@opticasfausto.com"   # por defecto, la direccion decodificada de contact.emailEnc

  # HORARIOS — fuente única para footer, página de contacto y schema.org.
  # Temporada invierno (oct–may): 17:30–21:00 · Temporada verano (jun–sep): revisar con cliente.
  # Formato legible → consumed by footer.html y contacto shortcode/partial
  hours:
    weekdays: "Lunes a viernes: 10:00–13:30 y 17:00–20:30"
    saturday: "Sábados: 10:00–13:30"
    sunday: ""   # vacío = cerrado, footer no lo muestra

  # Formato schema.org → consumed by schema.html. La clave es "days" (no
  # "dayOfWeek"): es la que lee schema.html al construir OpeningHoursSpecification.
  # Cada sede lo hereda de aquí; si en el futuro una difiere, añadir hoursSpec
  # dentro de esa location para sobreescribir.
  hoursSpec:
    - days: ["Monday","Tuesday","Wednesday","Thursday","Friday"]
      opens: "10:00"
      closes: "13:30"
    - days: ["Monday","Tuesday","Wednesday","Thursday","Friday"]
      opens: "17:00"
      closes: "20:30"
    - days: ["Saturday"]
      opens: "10:00"
      closes: "13:30"

# ─── NAVEGACIÓN ──────────────────────────────────────────────────────────────
navigation:
  main:
    - text: "Inicio"
      url: "/"
    - text: "Visión"
      url: "/vision/"
    - text: "Audición"
      url: "/audicion/"
    - text: "Nosotros"
      url: "/nosotros/"
    - text: "Contacto"
      url: "/contacto/"
  legal:
    - text: "Aviso Legal · Privacidad · Cookies"
      url: "/aviso-legal/"

# ─── SEDES ───────────────────────────────────────────────────────────────────
# hoursSpec se hereda de contact.hoursSpec en schema.html (mismos horarios ambas sedes).
# Si en el futuro una sede tuviera horario distinto, añadir hoursSpec aquí para sobreescribir.
#
# DOS NOMBRES POR SEDE:
#   name        etiqueta de la web ("Centro Fausto Andalucía"): tarjetas, footer, barra
#               fija. Sirve para orientar al cliente; va al schema como alternateName.
#   schemaName  nombre EXACTO del perfil de Google Business de esa sede. Va al schema
#               como name. Si se cambia el nombre en Google, se cambia aquí (y viceversa).
# id            ancla de la sede en /contacto/ (/contacto/#andalucia). Es la URL que va en
#               el campo "sitio web" de cada perfil de Google: no cambiarlo sin cambiar el perfil.
# phone         fijo de la sede = teléfono PRINCIPAL de su perfil de Google. El móvil
#               (contact.whatsapp) va como teléfono ADICIONAL en ambos perfiles.
# whatsapp      opcional. Sin él, el footer pone junto al fijo el WhatsApp común.
# offerCatalogs si una sede no ofrece todo lo de business.offerCatalogs, lista aquí solo lo
#               suyo (Duque: solo Visión). Sin la clave, hereda los de business.
locations:
  - id: "andalucia"
    name: "Centro Fausto Andalucía"
    schemaName: "Ópticas Fausto - Centro Auditivo"   # guion simple: Google desaconseja "·" y "&"
    address: "Av. Andalucía, 84 B"
    location: "Torre del Mar"
    phone: "+34952540964"
    phoneLabel: "952 54 09 64"
    mapUrl: "https://maps.google.com/?cid=9248588007090896676"    # Avenida
    image: "/images/400-fausto_andalucia_mapa.webp"
    imageAlt: "Fachada y ubicación de Fausto Andalucía en Google Maps"
  - id: "duque"
    name: "Centro Fausto Duque"
    schemaName: "Ópticas Fausto"
    address: "Av. Duque de Ahumada, 1C"
    location: "Torre del Mar"
    phone: "+34952547090"
    phoneLabel: "952 54 70 90"
    mapUrl: "https://maps.google.com/?cid=12933472947538996195"   # Duque
    image: "/images/400-fausto_duque_mapa.webp"
    imageAlt: "Fachada y ubicación de Fausto Duque en Google Maps"
    offerCatalogs:              # solo óptica: sin el catálogo de Audición
      - { name: "Visión", url: "/vision/" }

# ─── SOCIAL ──────────────────────────────────────────────────────────────────
social:
  - platform: "Facebook"
    url: "https://www.facebook.com/OpticaFaustoTorreDelMar/"
  - platform: "Instagram"
    url: "https://www.instagram.com/opticasfausto/"
