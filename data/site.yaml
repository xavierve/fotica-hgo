# data/site.yaml — Ópticas Fausto
# v04 — Horarios validados por cliente. Fuente única: contact.hours (footer/contacto)
#        y location.hoursSpec (schema.org). Cambiar aquí → se actualiza en todo el sitio.
# NOTA: actualizar también los dos Google Business Profiles cuando cambie el horario.

brand:
  name: "Ópticas Fausto"
  logo: "/images/logo-fausto.svg"
  logoAlt: "Ópticas Fausto — Centro Óptico y Auditivo en Torre del Mar"
  logoInline: "images/logo-fausto-animado.svg"
  themeColor: "#08783e"   # <meta name="theme-color">; mantener igual que --bg-color3

footer:
  brand:
    logo: "/images/logo-fausto-animado-claro.svg"
    logoAlt: "Ópticas Fausto — Centro Óptico y Auditivo en Torre del Mar"
  title: "Ópticas Fausto"
  description: "Desde 1982, cuidando bien de la vista y del oído."

business:
  locationType: "Optician"
  foundingDate: "1982"
  addressLocality: "Torre del Mar"
  postalCode: "29740"
  addressRegion: "Málaga"
  addressCountry: "ES"
  areaServed: "Torre del Mar, Vélez-Málaga, Málaga"
  offerCatalogs:
    - { name: "Visión", url: "/vision/" }
    - { name: "Audición", url: "/audicion/" }

# ─── CONTACTO ────────────────────────────────────────────────────────────────
# El móvil es el único número con WhatsApp. Los fijos NO tienen WhatsApp.
contact:
  phone: "+34717770090"
  phoneLabel: "717 77 00 90"
  whatsapp: "+34717770090"
  # Direccion de contacto CODIFICADA: base64 de la cadena invertida. Este repo es
  # publico, y una direccion en claro aqui se recolecta igual que en una pagina.
  # La decodifica partials/email-addr.html; para pintarla se usa email-link.html.
  # Para cambiarla:
  #   python -c "import base64;print(base64.b64encode('LA@DIRECCION.COM'[::-1].encode()).decode())"
  emailEnc: "bW9jLm90c3VhZnNhY2l0cG9Ab3RjYXRub2M="
  # Destino del icono Ubicacion de la barra fija movil: id de una entrada de
  # locations[] (usa su mapUrl; no repetir la URL aqui). Sin locationId el tema
  # cae a contact.locationUrl y, si tampoco existe, a /contacto/.
  locationId: "andalucia"

  # Formulario de contacto (/contacto/). Hugo genera public/contacto/config.php a
  # partir de esto; static/contacto/enviar.php lo lee. El destinatario es el buzon
  # de contact.email salvo que se ponga "to" aqui.
  #   from: direccion del PROPIO dominio del sitio (baseURL). Si no lo esta, el build
  #         falla: un From de otro dominio rompe la alineacion SPF/DKIM. NUNCA es la
  #         direccion del visitante (esa va en Reply-To). Conviene que exista como
  #         buzon, para recibir los rebotes.
  form:
    from: "web@opticasfausto.com"
    fromName: "Ópticas Fausto (web)"
    # to: "contacto@opticasfausto.com"   # por defecto, contact.email

  # HORARIOS — fuente única para footer, página de contacto y schema.org.
  # Temporada invierno (oct–may): 17:30–21:00 · Temporada verano (jun–sep): revisar con cliente.
  # Formato legible → consumed by footer.html y contacto shortcode/partial
  hours:
    weekdays: "Lunes a viernes: 10:00–13:30 y 17:30–21:00"
    saturday: "Sábados: 10:00–13:30"
    sunday: ""   # vacío = cerrado, footer no lo muestra

  # Formato schema.org → consumed by schema.html. La clave es "days" (no
  # "dayOfWeek"): es la que lee schema.html al construir OpeningHoursSpecification.
  # Cada sede lo hereda de aquí; si en el futuro una difiere, añadir hoursSpec
  # dentro de esa location para sobreescribir.
  hoursSpec:
    - days: ["Monday","Tuesday","Wednesday","Thursday","Friday"]
      opens: "10:00"
      closes: "13:30"
    - days: ["Monday","Tuesday","Wednesday","Thursday","Friday"]
      opens: "17:30"
      closes: "21:00"
    - days: ["Saturday"]
      opens: "10:00"
      closes: "13:30"

# ─── NAVEGACIÓN ──────────────────────────────────────────────────────────────
